<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10253f"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"><title>AUVASA GPS</title></head><body><header><div class="brand">AUVASA <span>GPS</span></div><div class="sub">Navegación para conductores</div></header><main><section class="controls"><label>Línea<select id="line"><option value="">Importa los datos GTFS</option></select></label><label>Sentido<select id="direction" disabled><option>Selecciona una línea</option></select></label><button id="start" disabled>Iniciar navegación</button><button id="stop" class="secondary" disabled>Finalizar</button><label class="upload">Cargar archivo GTFS (.zip)<input id="gtfs" type="file" accept=".zip,application/zip"></label><p id="status">Carga el archivo GTFS oficial de AUVASA para disponer de líneas y paradas reales.</p></section><section class="mapwrap"><div id="map"></div><div class="overlay"><div class="speed"><strong id="speed">--</strong><small>km/h</small></div><div><small>LÍMITE</small><strong id="limit">--</strong></div></div></section><section class="next"><small>PRÓXIMA PARADA</small><strong id="nextstop">Selecciona línea y sentido</strong><span id="distance">La navegación GPS aún no está activa</span></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="app.js"></script></body></html>
